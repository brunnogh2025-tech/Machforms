spring.application.name=machforms-backend
# O frontend chama http://localhost:3000/api. Para mudar: variável PORT ou esta linha.
server.port=${PORT:3000}

# ---------- Banco de dados (MySQL, porta padrão 3306) ----------
# createDatabaseIfNotExist cria o machforms_db automaticamente na primeira execução.
spring.datasource.url=jdbc:mysql://localhost:3306/MachForms?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:My$Qi_m4Ch}

# ---------- JPA / Hibernate ----------
# "update" cria/ajusta as tabelas sozinho (ótimo para desenvolvimento e TCC).
# Em produção, prefira "validate" com migrações (Flyway/Liquibase).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---------- Segurança (JWT) ----------
# Defina MACHFORMS_JWT_SECRET em produção (mínimo de 32 caracteres).
machforms.security.jwt.secret=${MACHFORMS_JWT_SECRET:dev-only-secret-troque-em-producao-0123456789}
machforms.security.jwt.expiration=PT8H

# ---------- CORS ----------
# Origens do frontend permitidas. Se abrir o HTML direto do disco (file://),
# acrescente "null" à lista (veja o README).
machforms.cors.allowed-origin-patterns=http://localhost:*,http://127.0.0.1:*,null
